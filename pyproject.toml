[project]
name = "m2h"
version = "0.1.0"
description = "Convert Markdown to HTML via the macOS clipboard"
requires-python = ">=3.10"
dependencies = [
    "markdown",
    "pyobjc-framework-Cocoa",
]

[project.scripts]
m2h = "m2h:convert"

[tool.uv]
exclude-newer = "1 week"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
