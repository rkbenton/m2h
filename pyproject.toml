[project]
name = "m2h"
version = "0.1.0"
description = "Convert Markdown to HTML via the macOS clipboard"
requires-python = ">=3.10"
dependencies = [
    "markdown",
    "pyobjc-framework-Cocoa",
]

[project.scripts]
m2h = "m2h:convert"

[tool.uv]
exclude-newer = "1 week"

[tool.ty.analysis]
# pyobjc builds the names in AppKit dynamically when it is imported and ships no type
# stubs, so ty cannot see NSPasteboard and friends even though they exist at runtime.
# Only AppKit is allowed; every other unresolved import is still reported.
allowed-unresolved-imports = ["AppKit.**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
